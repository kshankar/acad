# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the
#     `id:` of the desired block in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.
#   Ordered roughly by expected visitor importance: identity/publications first,
#   supporting/service content in the middle, teaching & supervision (mainly
#   relevant to current/prospective students) pushed toward the end.
#   Kept deliberately short (8 items) so it doesn't wrap onto a second line.
#   Upcoming Events, Services, and the Teaching course list are still on the
#   site (homepage / Experience / Teaching page) — just not in the top nav.

main:
  - name: Home
    url: /
    weight: 10
  - name: Publications
    url: publications/
    weight: 20
  - name: Accomplishments
    url: /#accomplishments
    weight: 30
  - name: Talks
    url: /#talks
    weight: 40
  - name: Projects
    url: projects/
    weight: 50
  - name: Experience
    url: experience/
    weight: 55
  - name: Teaching
    url: teaching/
    weight: 80
  - name: Contact
    url: /#contact
    weight: 90
