bio: |
  Shankar Karuppayah is an Associate Professor and Deputy Director at the [Cybersecurity Research Centre (CYRES), Universiti Sains Malaysia (USM)](https://www.cyres.usm.my) — formerly the National Advanced IPv6 Centre (NAv6), which he joined as Senior Lecturer in 2016 and which was renamed CYRES in January 2025. He is also the Founder & CEO of [BitRanger Sdn. Bhd.](https://www.bitranger.io), a USM cybersecurity spin-off established in October 2023 that translates research and innovation from USM/CYRES into operational cybersecurity capabilities, including OwlSight, an outsourced Security Operations Centre platform.

  He obtained his B.Sc (HONS) Computer Science from Universiti Sains Malaysia in 2009 and his M.Sc. Software Systems Engineering from King Mongkut's University of Technology North Bangkok (KMUTNB) in 2011. In 2016, Shankar obtained his PhD (Dr. rer. nat.) from TU Darmstadt, where his research on advanced techniques for monitoring peer-to-peer botnets later formed the basis of his Springer book, *Advanced Monitoring in P2P Botnets: A Dual Perspective*.

  His research has since expanded from P2P botnet monitoring and malware analysis into broader areas including intrusion detection, cyber threat intelligence, machine learning for cybersecurity, IoT and cyber-physical security, network security monitoring, and the translation of cybersecurity research into deployable, operational technologies.

